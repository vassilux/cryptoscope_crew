scan_market:
  description: |
    Réponds uniquement en {lang}. Si ta sortie contient de l’anglais, retraduis immédiatement en {lang}.
    Date: {report_date}  Heure: {report_time}  ISO: {report_iso} (TZ: {tz})
    Paires : {pairs_display} 
    Timeframes: {timeframes_display}
    {header_md}
    (lookback={lookback})
    Contexte JSON:
    {context_json}
    Mission: liste 3–5 catalyseurs (ETF, listings, upgrades L2, régulation) avec une phrase de résumé chacun.
    Si l’outil de recherche a trouvé une source, cite-la ; sinon écris "Aucune source vérifiée".
  expected_output: '{"key_drivers":["..."]}'
  agent: researcher

tech_review:
  description: |
    Réponds uniquement en {lang}. Si ta sortie contient de l’anglais, retraduis immédiatement en {lang}.
    Table technique (ne pas modifier) :

    Timeframes: {timeframes_display}

    -----
    {tech_table_md}
    -----
    
    Synthèse multi-timeframe :
    -----
    {summary_table_md}
    -----

    Tables des autres timeframes :
    {tech_tables_md}

    Donne 3–5 observations techniques (tendance, momentum, divergences, invalidations).

  expected_output: '{"tech_notes":["..."]}'
  agent: technician

reporting_task:
  description: |
    Réponds uniquement en {lang}. Sans blocs de code (pas de ```).

    Commence ta réponse en reproduisant EXACTEMENT ce bloc :
    ---
    {header_md}
    ---

    Ensuite, retourne EXACTEMENT ces sections, une seule fois chacune, dans cet ordre :
    "## Points clés", "## Configuration technique", "## Synthèse multi-timeframe", "## Triggers par paire", "## Signaux prêts à tirer", "## Risques", "## Watchlist".

    ## Configuration technique
    -----
    {tech_table_md}
    -----

    ## Synthèse multi-timeframe
    -----
    {summary_table_md}
    -----
    {tech_tables_md}

    ## Triggers par paire
    {triggers_md}

    ## Signaux prêts à tirer
    {ready_signals_md}

    ## Risques
    (complète selon le contexte)

    ## Watchlist
    (complète selon le contexte)

    Contexte (référence) :
    {context_json}
  expected_output: "Markdown final du rapport."
  agent: reporting_analyst
  output_file: "{report_output_path}"

