scan_market:
  description: |
    Réponds uniquement en {lang}.
    {header_md}

    Mission:
    - Dresse 3–5 catalyseurs du jour (ETF, listings, upgrades L2, régulation/macro) avec une phrase de résumé chacun.
    - Si l’outil de recherche a trouvé une source vérifiée, cite-la (1 lien max par bullet).
    - Sinon, écris "Aucune source vérifiée".
  expected_output: '{"key_drivers":["..."]}'
  agent: researcher

narrative_scan:
  description: |
    Réponds uniquement en {lang}.
    {header_md}

    Utilise la recherche (24–72h) pour détecter 3–5 narratifs crypto “en tendance” :
    - exemples: ETF SOL/ETH, L2 upgrades, AI-coins, RWA, memecoins, airdrops, restaking, inscriptions/BRC-20.
    - privilégie des sources reconnues (CoinDesk, Blockworks, The Block, Bloomberg Crypto, CNBC Crypto, FT, WSJ, Messari).
    - écarte blogs obscurs / fils X non vérifiables.
    - chaque narratif doit citer une source DISTINCTE : ne réutilise JAMAIS la même URL pour plusieurs narratifs (un narratif sans source propre sera écarté).
    - cite uniquement des URLs réellement retournées par l'outil de recherche — n'invente aucun lien.

    Heat scoring:
    1 = bruit faible ; 2 = niche ; 3 = modéré (quelques sources) ;
    4 = fort (plusieurs sources, tokens impliqués) ; 5 = très fort (flux mesurables, catalyse ≤72h).

    Rends un JSON STRICT (sans texte autour) :
    {"narratives":[
      {"title":"...", "summary":"...", "tickers":["...","..."], "heat":4, "sources":["https://..."]},
      {"title":"...", "summary":"...", "tickers":["..."], "heat":3, "sources":["https://..."]}
    ]}
  expected_output: '{"narratives":[{"title":"...", "summary":"...", "tickers":["..."], "heat":3, "sources":["..."]}]}'
  agent: researcher

social_scan:
  description: |
    Réponds uniquement en {lang}.
    {header_md}

    Utilise les outils Membit (cluster_search, etc.) pour analyser Twitter/X sur les dernières 24–48h.
    Focus : {pairs_display} + crypto en général.

    Produis :
    1. Sentiment global (bull / bear / neutre) avec ratio approximatif (ex: "60% bull / 30% bear / 10% neutre")
    2. Top 3–5 clusters/sujets dominants avec :
       - titre court
       - résumé (1 phrase)
       - tickers associés
       - score momentum (1–10)
       - volume estimé (low/medium/high)
    3. Signaux faibles : 1–3 narratifs émergents à faible volume mais forte vélocité

    Rends un JSON STRICT (sans texte autour) :
    {"sentiment":{"bull_pct":60,"bear_pct":30,"neutral_pct":10,"label":"bull"},
     "clusters":[
       {"title":"...","summary":"...","tickers":["BTC"],"momentum":8,"volume":"high"},
       {"title":"...","summary":"...","tickers":["ETH"],"momentum":6,"volume":"medium"}
     ],
     "weak_signals":[
       {"title":"...","summary":"...","tickers":["..."],"momentum":3,"volume":"low"}
     ]}
  expected_output: '{"sentiment":{...},"clusters":[...],"weak_signals":[...]}'
  agent: narrative_hunter

tech_review:
  description: |
    Réponds uniquement en {lang}.
    {header_md}

    Table (timeframe principal — ne pas modifier) :
    -----
    {tech_table_md}
    -----

    Synthèse multi-timeframe :
    -----
    {summary_table_md}
    -----
    {tech_tables_md}

    Donne 3–5 observations techniques (tendance, momentum, divergences multi-TF, invalidations).
  expected_output: '{"tech_notes":["..."]}'
  agent: technician

reporting_task:
  description: |
    Réponds uniquement en {lang}. Sans blocs de code (pas de ```).

    Commence par reproduire EXACTEMENT ce bloc :
    ---
    {header_md}
    ---

    Ensuite, retourne UNIQUEMENT ces sections, une seule fois chacune, dans cet ordre :

    ## Points clés
    - 3 bullets max, orientés décision, en français.

    ## Narratifs en tendance
    À partir des résultats de 'narrative_scan' (JSON), synthétise 3–5 bullets :
    - Titre (Heat {1..5}) — 1 phrase — Tickers — 1 source max.
    - Ne pas inventer de liens : cite uniquement ceux fournis par 'narrative_scan'.
    - Une source DISTINCTE par narratif : si deux narratifs partagent la même URL, n'affiche que celui au Heat le plus élevé.
    - Si aucune source vérifiée pour un narratif, ne pas l’afficher.

    ## Risques
    (liste concise et spécifique)

    ## Watchlist
    (niveaux/événements à surveiller, concis)

    IMPORTANT — N'inclus AUCUNE section technique (tables EMA/RSI, synthèse
    multi-timeframe, signaux, triggers) : elles sont injectées automatiquement
    par le système après ta rédaction. Les recopier créerait des doublons.

    Données techniques (référence pour tes "Points clés" — NE PAS recopier) :
    -----
    {tech_table_md}

    {summary_table_md}
    -----

    Contexte (référence) :
    {context_json}
  expected_output: "Markdown final du rapport (Points clés, Narratifs, Risques, Watchlist — sans sections techniques)."
  agent: reporting_analyst
